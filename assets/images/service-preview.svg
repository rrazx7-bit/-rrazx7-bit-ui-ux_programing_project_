<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">모아봄 과제 목록 예시</title>
  <desc id="desc">마감일 순서로 정리한 과제 목록. UI/UX 과제는 오늘 마감, 글쓰기 과제는 내일 마감, 자료조사 과제는 완료로 표시되어 있다.</desc>
  <rect width="600" height="400" rx="20" fill="#f4f6ef"/>
  <g font-family="sans-serif">
    <text x="32" y="47" font-size="26" font-weight="bold" fill="#234c3c">모아봄</text>
    <text x="455" y="46" font-size="20" fill="#556354">예시 화면</text>
    <text x="32" y="100" font-size="32" font-weight="bold" fill="#202d24">오늘 할 일</text>
    <text x="32" y="134" font-size="20" fill="#556354">마감이 가까운 과제부터 하나씩</text>

    <rect x="28" y="158" width="544" height="62" rx="10" fill="#ffffff" stroke="#c6cec1"/>
    <rect x="46" y="177" width="24" height="24" rx="4" fill="none" stroke="#687961" stroke-width="2"/>
    <text x="86" y="199" font-size="24" fill="#202d24">UI/UX · 서비스 소개</text>
    <text x="460" y="198" font-size="22" font-weight="bold" fill="#8d3a1b">오늘</text>

    <rect x="28" y="234" width="544" height="62" rx="10" fill="#ffffff" stroke="#c6cec1"/>
    <rect x="46" y="253" width="24" height="24" rx="4" fill="none" stroke="#687961" stroke-width="2"/>
    <text x="86" y="275" font-size="24" fill="#202d24">글쓰기 · 초안 작성</text>
    <text x="460" y="274" font-size="22" fill="#556354">내일</text>

    <rect x="28" y="310" width="544" height="62" rx="10" fill="#e3ebdb"/>
    <rect x="46" y="329" width="24" height="24" rx="4" fill="#356349"/>
    <path d="m51 340 5 6 9-12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="351" font-size="24" fill="#344632">자료조사 · 참고 자료</text>
    <text x="460" y="350" font-size="22" fill="#344632">완료</text>
  </g>
</svg>
